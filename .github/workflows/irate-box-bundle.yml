name: Irate-Box app bundle (serial)

# Builds the serial terminal (npm run build: a static Vite build, served at /serial/) for the Irate-Box hub, plus
# serial-terminal.html, the same app as one file to download for live USB, and uploads them as a run artifact,
# irate-box-serial-<commit>, which the hub's librarian can install (through nightly.link, or with
# a GitHub token). No releases: this is a fork for testing. Built from this repository.
# The bundle carries irate-box-bundle.json: which repository and commit it was built from.
# Artifacts expire after 90 days, so this also runs monthly.

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 1 * *'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        default: main

permissions:
  contents: read

concurrency:
  group: irate-box-bundle
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Single-file download (live USB serial from a file opened on the user's machine)
        # Web Serial needs a secure context: a page opened from file:// is one, the hub's plain
        # HTTP is not. The hub offers this file as a download beside the in-place /serial/.
        # vite-plugin-singlefile is installed here only (--no-save), so the project's own
        # build, package.json and lockfile are untouched. Config: .github/irate-box/.
        run: |
          npm install --no-save --no-audit --no-fund vite-plugin-singlefile
          SINGLEFILE_OUT=/tmp/single npx vite build --config .github/irate-box/vite.singlefile.config.mjs
          cp /tmp/single/index.html dist/serial-terminal.html
          (cd dist && sha256sum serial-terminal.html > serial-terminal.html.sha256)
          du -h dist/serial-terminal.html
      - name: Third-party notices
        # THIRD-PARTY-NOTICES.txt in the bundle: what npm does not describe first, then every
        # package installed under node_modules with its license text -- a superset of what the
        # bundle contains, since bundlers also take from devDependencies.
        run: |
          out="dist/THIRD-PARTY-NOTICES.txt"
          {
            cat <<NOTICE
          Meshtastic serial terminal and log analyser, GNU General Public License v3.0, built for the Irate-Box hub from ${{ github.repository }} at $(git rev-parse HEAD).
          Source: https://github.com/${{ github.repository }}/tree/$(git rev-parse HEAD)

          NOTICE
            cat <<'NOTICE'
          This program is free software: you can redistribute it and/or modify it under the terms
          of the GNU General Public License, version 3 (LICENSE in the source above). The source
          for this exact build is the commit named above.

          NOTICE
            node .github/scripts/irate-box-notices.mjs node_modules
          } > "$out"
          du -h "$out"
      - name: Record what was built
        run: |
          cat > "dist/irate-box-bundle.json" <<JSON
          {"app": "serial", "repository": "${{ github.repository }}", "ref": "$(git rev-parse --abbrev-ref HEAD)",
           "commit": "$(git rev-parse HEAD)", "built": "$(date -u +%Y-%m-%dT%H:%M:%SZ)", "run": ${{ github.run_id }}}
          JSON
          echo "SHORT=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          du -sh "dist"

      - uses: actions/upload-artifact@v7
        with:
          name: irate-box-serial-${{ env.SHORT }}
          path: dist
          retention-days: 90
          compression-level: 6
          if-no-files-found: error
